<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kakis — find your people</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Find your people">
<meta property="og:description" content="A new way to make friends in Singapore. Take a look.">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#F3F1F8;color:#1B2240;display:flex;min-height:100vh;align-items:center;justify-content:center}a{color:#1B2240}</style>
<script>
(function(){
  // Random, sticky split: each visitor sees one variant and keeps seeing it.
  var V={ritual:'index.html',rookies:'rookies.html',hello:'hello.html'};
  var keys=Object.keys(V), k=null;
  try{ k=localStorage.getItem('kakis_variant'); }catch(e){}
  if(!V[k]){ k=keys[Math.floor(Math.random()*keys.length)]; try{ localStorage.setItem('kakis_variant',k); }catch(e){} }
  var q=location.search ? location.search.slice(1)+'&' : '';
  location.replace(V[k]+'?'+q+'v='+k);
})();
</script>
</head>
<body><p>Taking you there&hellip; <a href="index.html">continue</a></p></body>
</html>
